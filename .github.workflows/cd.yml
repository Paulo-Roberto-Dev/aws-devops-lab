name: CD

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"

permissions:
  contents: read

concurrency:
  group: deploy-producao
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Conectar ao Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Deploy no servidor
        run: |
          ssh -o StrictHostKeyChecking=accept-new hidokai@100.80.240.46 '
            set -e
            cd ~/aws-devops-lab
            git pull --ff-only
            docker compose -f app/compose.yaml up -d
            docker compose -f app/compose.yaml ps
          '
